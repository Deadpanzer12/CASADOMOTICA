    <style>

        ::-webkit-scrollbar { width: 8px; height: 8px; }

        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #0891b2; }

        .markdown-body h1 { font-size: 1.65rem; font-weight: 800; margin-top: 1.25rem; margin-bottom: 0.75rem; border-bottom: 1px solid rgba(226, 232, 240, 0.15); padding-bottom: 0.4rem; color: #38bdf8; }
        .markdown-body h2 { font-size: 1.3rem; font-weight: 700; margin-top: 1.1rem; margin-bottom: 0.5rem; color: #e2e8f0; }
        .markdown-body h3 { font-size: 1.1rem; font-weight: 600; margin-top: 0.9rem; margin-bottom: 0.4rem; color: #cbd5e1; }
        .markdown-body p { margin-bottom: 0.85rem; line-height: 1.6; font-size: 0.9rem; }
        .markdown-body ul { list-style-type: disc; padding-left: 1.5rem; margin-bottom: 0.85rem; font-size: 0.9rem; }
        .markdown-body ol { list-style-type: decimal; padding-left: 1.5rem; margin-bottom: 0.85rem; font-size: 0.9rem; }
        .markdown-body blockquote { border-left: 4px solid #06b6d4; padding-left: 1rem; color: #94a3b8; font-style: italic; margin-bottom: 0.85rem; background: rgba(6, 182, 212, 0.05); padding-top: 0.4rem; padding-bottom: 0.4rem; border-radius: 0 0.5rem 0.5rem 0; }
        .markdown-body table { width: 100%; border-collapse: collapse; margin-bottom: 1rem; font-size: 0.85rem; }
        .markdown-body th, .markdown-body td { border: 1px solid #334155; padding: 0.5rem 0.75rem; }

        .markdown-body code:not(pre code) { background-color: rgba(15, 23, 42, 0.6); padding: 0.15rem 0.4rem; border-radius: 0.25rem; font-family: monospace; font-size: 0.85em; color: #38bdf8; }
        .markdown-body pre { position: relative; margin-bottom: 1rem; border-radius: 0.75rem; overflow: hidden; background: #0f172a; border: 1px solid #1e293b; padding: 1rem; }
    </style>
</head>
<body class="bg-slate-50 dark:bg-darkbg text-slate-800 dark:text-slate-100 min-h-screen transition-colors duration-200 flex flex-col font-sans">

    <!-- LOGICA JS -->
    <script>
        const GITHUB_OWNER = "Deadpanzer12";
        const GITHUB_REPO = "CASADOMOTICA";

        const DEFAULT_SUBJECTS = [
            { id: "aso", codigo: "ASO", nombre: "Administración de Sistemas Operativos", folder: "aso", icon: "fa-laptop-code", color: "sky", desc: "Linux/Windows Server, automatización con Bash/PowerShell y administración." },
            { id: "digitalizacion", codigo: "DIG", nombre: "Digitalización", folder: "digitalizacion", icon: "fa-cloud-arrow-up", color: "indigo", desc: "Transformación digital, metodologías ágiles y entornos Cloud Native." },
            { id: "sgea", codigo: "SGEA", nombre: "Sistemas De Gestión Empresariales Actuales", folder: "sgea", icon: "fa-boxes-stacked", color: "purple", desc: "Implantación, desarrollo de módulos y configuración de ERPs (Odoo)." },
            { id: "iaw", codigo: "IAW", nombre: "Implantación de aplicaciones WEB", folder: "iaw", icon: "fa-globe", color: "emerald", desc: "Servidores web Nginx/Apache, pilas LAMP/LEMP, HTTPS y PHP." },
            { id: "ip2", codigo: "IP2", nombre: "IP2 (Iniciativa y Proyecto 2)", folder: "ip2", icon: "fa-diagram-project", color: "amber", desc: "Proyecto integrador de infraestructuras y domótica CASADOMOTICA." },
            { id: "redes", codigo: "RED", nombre: "Redes", folder: "redes", icon: "fa-network-wired", color: "blue", desc: "Enrutamiento OSPF, VLANs, switching L3 y Packet Tracer." },
            { id: "sad", codigo: "SAD", nombre: "Seguridad y Alta Disponibilidad", folder: "sad", icon: "fa-shield-halved", color: "rose", desc: "Firewalls, SSL/TLS, hardening SSH, Fail2ban y clústeres HA." },
            { id: "nube", codigo: "NUBE", nombre: "Servicios en la nube", folder: "nube", icon: "fa-cloud", color: "teal", desc: "Despliegues Cloud (AWS, Azure), IaaC con Terraform y Docker." },
            { id: "sgbd", codigo: "SGBD", nombre: "Sistemas Gestores de Bases de Datos", folder: "sgbd", icon: "fa-database", color: "cyan", desc: "Administración de MariaDB/PostgreSQL, réplicas y copias de seguridad." },
            { id: "sostenibilidad", codigo: "SOST", nombre: "Sostenibilidad", folder: "sostenibilidad", icon: "fa-leaf", color: "green", desc: "Green IT, cálculo del PUE en Datacenters y eficiencia energética." }
        ];

        let appConfig = loadAppConfig();
        let ghToken = localStorage.getItem('casadomotica_gh_token') || '';
        let githubCache = {};
        let currentView = 'dashboard';
        let currentParam = null;

        window.onload = function() {
            initSidebar();
            renderView('dashboard');
            setupSearch();
        };

        function loadAppConfig() {
            const saved = localStorage.getItem('casadomotica_config');
            if (saved) {
                try { return JSON.parse(saved); } catch(e) {}
            }
            return { subjects: DEFAULT_SUBJECTS };
        }

        function saveAppConfig(cfg) {
            appConfig = cfg;
            localStorage.setItem('casadomotica_config', JSON.stringify(cfg));
            initSidebar();
        }

        function toggleTheme() {
            const html = document.documentElement;
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                localStorage.setItem('theme', 'light');
            } else {
                html.classList.add('dark');
                localStorage.setItem('theme', 'dark');
            }
        }

        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const bgClass = type === 'success' ? 'bg-emerald-600' : type === 'error' ? 'bg-rose-600' : 'bg-brand-600';
            toast.className = `${bgClass} text-white px-4 py-3 rounded-xl shadow-xl text-xs font-semibold flex items-center justify-between gap-3 animate-fade-in pointer-events-auto`;
            toast.innerHTML = `
                <div class="flex items-center gap-2">
                    <i class="fa-solid ${type === 'success' ? 'fa-circle-check' : type === 'error' ? 'fa-triangle-exclamation' : 'fa-circle-info'} text-base"></i>
                    <span>${message}</span>
                </div>
                <button onclick="this.parentElement.remove()" class="text-white/80 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
            `;
            container.appendChild(toast);
            setTimeout(() => { if (toast.parentNode) toast.remove(); }, 5000);
        }

        function customConfirm(title, text, onAccept) {
            const modal = document.getElementById('confirm-modal');
            document.getElementById('confirm-modal-title').innerText = title;
            document.getElementById('confirm-modal-text').innerText = text;
            modal.classList.remove('hidden');

            const acceptBtn = document.getElementById('confirm-modal-accept');
            const cancelBtn = document.getElementById('confirm-modal-cancel');

            const cleanup = () => {
                modal.classList.add('hidden');
                acceptBtn.onclick = null;
                cancelBtn.onclick = null;
            };

            acceptBtn.onclick = () => { cleanup(); onAccept(); };
            cancelBtn.onclick = () => { cleanup(); };
        }

        /* -------------------------------------------------------------------------- */
        /*   API GITHUB REST (LECTURA Y ESCRITURA)                                   */
        /* -------------------------------------------------------------------------- */
        async function fetchGitHubContents(path = '') {
            const cacheKey = `gh_contents_${path}`;
            if (githubCache[cacheKey]) return githubCache[cacheKey];

            const url = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${path}`;
            const headers = { 'Accept': 'application/vnd.github.v3+json' };
            if (ghToken) headers['Authorization'] = `token ${ghToken}`;

            try {
                const res = await fetch(url, { headers });
                if (res.status === 404) return { error: '404', message: 'Carpeta o archivo no encontrado' };
                if (res.status === 403) return { error: '403', message: 'Límite de API alcanzado o token inválido' };
                if (!res.ok) return { error: res.status, message: `Error HTTP ${res.status}` };

                const data = await res.json();
                githubCache[cacheKey] = data;
                return data;
            } catch (err) {
                return { error: 'network', message: 'Error de red con GitHub API' };
            }
        }

        async function fetchRawFileContent(downloadUrl) {
            try {
                const res = await fetch(downloadUrl);
                if (!res.ok) return 'Error al descargar archivo.';
                return await res.text();
            } catch(e) { return 'Error de red.'; }
        }

        async function pushFileToGitHub(path, base64Content, commitMessage) {
            if (!ghToken) {
                showToast("Se requiere un Personal Access Token de GitHub para publicar.", "error");
                return false;
            }

            const url = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${path}`;
            
            // Comprobar si el archivo ya existe para obtener su SHA (actualización)
            let existingSha = null;
            try {
                const checkRes = await fetch(url, {
                    headers: { 'Authorization': `token ${ghToken}`, 'Accept': 'application/vnd.github.v3+json' }
                });
                if (checkRes.ok) {
                    const checkData = await checkRes.json();
                    existingSha = checkData.sha;
                }
            } catch (e) {}

            const bodyPayload = {
                message: commitMessage || `Publicado desde Editor Web CASADOMOTICA`,
                content: base64Content
            };
            if (existingSha) bodyPayload.sha = existingSha;

            try {
                const putRes = await fetch(url, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${ghToken}`,
                        'Content-Type': 'application/json',
                        'Accept': 'application/vnd.github.v3+json'
                    },
                    body: JSON.stringify(bodyPayload)
                });

                if (putRes.ok || putRes.status === 201 || putRes.status === 200) {
                    githubCache = {}; // Invalidate cache
                    return true;
                } else {
                    const errData = await putRes.json();
                    showToast(`Error de GitHub: ${errData.message || putRes.statusText}`, "error");
                    return false;
                }
            } catch (err) {
                showToast("Error de conexión al subir archivo.", "error");
                return false;
            }
        }

        function refreshGitHubData() {
            githubCache = {};
            renderView(currentView, currentParam);
            showToast("Datos recargados desde GitHub", "info");
        }

        /* -------------------------------------------------------------------------- */
        /*   SIDEBAR & VISTAS                                                         */
        /* -------------------------------------------------------------------------- */
        function initSidebar() {
            const subjContainer = document.getElementById('sidebar-subjects-list');
            subjContainer.innerHTML = appConfig.subjects.map(asig => `
                <button onclick="showView('subject', '${asig.id}')" class="nav-item w-full flex items-center justify-between px-3 py-1.5 rounded-lg text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors" data-target="subject-${asig.id}">
                    <span class="flex items-center gap-2 truncate">
                        <i class="fa-solid ${asig.icon || 'fa-folder'} text-${asig.color || 'brand'}-500 w-4 text-center"></i>
                        <span class="truncate">${asig.codigo}</span>
                    </span>
                    <span class="text-[9px] bg-slate-200 dark:bg-slate-800 text-slate-500 px-1.5 py-0.5 rounded font-mono">${asig.folder}</span>
                </button>
            `).join('');

            loadSidebarExtras();

            const sidebar = document.getElementById('sidebar');
            document.getElementById('mobile-menu-btn').onclick = () => sidebar.classList.remove('-translate-x-full');
            document.getElementById('close-sidebar-btn').onclick = () => sidebar.classList.add('-translate-x-full');
        }

        async function loadSidebarExtras() {
            const extraContainer = document.getElementById('sidebar-extras-list');
            extraContainer.innerHTML = `<span class="text-[11px] text-slate-500 px-3 flex items-center gap-2"><i class="fa-solid fa-spinner fa-spin"></i> Cargando...</span>`;
            
            const contents = await fetchGitHubContents('adicionales');
            
            if (Array.isArray(contents)) {
                const subfolders = contents.filter(item => item.type === 'dir');
                if (subfolders.length === 0) {
                    extraContainer.innerHTML = `<span class="text-[11px] text-slate-500 px-3">Carpeta vacía</span>`;
                } else {
                    extraContainer.innerHTML = subfolders.map(sub => `
                        <button onclick="showView('extra', '${sub.name}')" class="nav-item w-full flex items-center gap-2 px-3 py-1.5 rounded-lg text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors truncate" data-target="extra-${sub.name}">
                            <i class="fa-solid fa-folder-open text-amber-500 w-4 text-center"></i>
                            <span class="truncate capitalize">${sub.name.replace(/-/g, ' ')}</span>
                        </button>
                    `).join('');
                }
            } else {
                extraContainer.innerHTML = `
                    <button onclick="showView('extra', 'tunel-ssh')" class="w-full flex items-center gap-2 px-3 py-1.5 rounded-lg text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
                        <i class="fa-solid fa-terminal text-amber-500 w-4 text-center"></i>
                        <span class="truncate">Túnel SSH Remoto</span>
                    </button>

        function toggleSectionOptions() {
            const sec = document.getElementById('pub-section-type').value;
            document.getElementById('target-subject-box').classList.toggle('hidden', sec !== 'subject');
            document.getElementById('target-extra-box').classList.toggle('hidden', sec !== 'extra');
        }

        function togglePubType() {
            const type = document.querySelector('input[name="pub_type"]:checked').value;
            document.getElementById('pub-markdown-box').classList.toggle('hidden', type !== 'markdown');
            document.getElementById('pub-file-box').classList.toggle('hidden', type !== 'file');
        }

        function openEditorForTarget(type, folder) {
            showView('editor');
            setTimeout(() => {
                const secSel = document.getElementById('pub-section-type');
                if (secSel) {
                    secSel.value = type;
                    toggleSectionOptions();
                    if (type === 'subject') {
                        document.getElementById('pub-subject-select').value = folder;
                    } else if (type === 'extra') {
                        document.getElementById('pub-extra-name').value = folder;
                    }
                }
            }, 100);
        }

        function saveTokenFromEditor() {
            const input = document.getElementById('editor-token-input');
            if (input && input.value.trim()) {
                ghToken = input.value.trim();
                localStorage.setItem('casadomotica_gh_token', ghToken);
                showToast("Token guardado con éxito.", "success");
                renderView('editor');
            }
        }

        function clearToken() {
            customConfirm("Borrar token", "¿Seguro que deseas eliminar tu token de este navegador?", () => {
                ghToken = '';
                localStorage.removeItem('casadomotica_gh_token');
                showToast("Token eliminado del navegador.", "info");
                renderView('editor');
            });
        }

        async function executePublishing() {
            if (!ghToken) {
                showToast("Debes introducir tu Token de GitHub para publicar.", "error");
                return;
            }

            const secType = document.getElementById('pub-section-type').value;
            let folder = '';
            if (secType === 'subject') {
                folder = document.getElementById('pub-subject-select').value;
            } else {
                folder = document.getElementById('pub-extra-name').value.trim().toLowerCase().replace(/\s+/g, '-');
                if (!folder) {
                    showToast("Escribe el nombre del proyecto adicional.", "error");
                    return;
                }
            }

            const pubType = document.querySelector('input[name="pub_type"]:checked').value;
            const btn = document.getElementById('pub-submit-btn');
            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Publicando en GitHub...`;

            if (pubType === 'markdown') {
                const fileName = document.getElementById('pub-md-filename').value.trim() || 'README.md';
                const title = document.getElementById('pub-md-title').value.trim() || 'Documentación';
                const rawBody = document.getElementById('pub-md-content').value;

                const fullMd = `# ${title}\n\n${rawBody}\n\n---\n*Publicado desde la web de CASADOMOTICA (2º ASIR).*`;
                // Encode UTF-8 strings properly to Base64
                const base64Content = btoa(unescape(encodeURIComponent(fullMd)));

                const path = secType === 'subject' ? `asignaturas/${folder}/${fileName}` : `adicionales/${folder}/${fileName}`;
                const success = await pushFileToGitHub(path, base64Content, `Añadir/Actualizar ${fileName} en ${folder}`);

                btn.disabled = false;
                btn.innerHTML = `<i class="fa-solid fa-cloud-arrow-up"></i> Publicar en GitHub`;

                if (success) {
                    showToast(`¡Archivo ${fileName} publicado con éxito!`, "success");
                    showView(secType, secType === 'subject' ? getSubjectIdByFolder(folder) : folder);
                }
            } else {
                const fileInput = document.getElementById('pub-file-input');
                if (!fileInput.files || fileInput.files.length === 0) {
                    showToast("Selecciona un archivo para subir.", "error");
                    btn.disabled = false;
                    btn.innerHTML = `<i class="fa-solid fa-cloud-arrow-up"></i> Publicar en GitHub`;
                    return;
                }

                const file = fileInput.files[0];
                const reader = new FileReader();

                reader.onload = async function(e) {
                    const dataUrl = e.target.result;
                    const base64Content = dataUrl.split(',')[1];

                    const path = secType === 'subject' ? `asignaturas/${folder}/${file.name}` : `adicionales/${folder}/${file.name}`;
                    const success = await pushFileToGitHub(path, base64Content, `Subir ${file.name} a ${folder}`);

                    btn.disabled = false;
                    btn.innerHTML = `<i class="fa-solid fa-cloud-arrow-up"></i> Publicar en GitHub`;

                    if (success) {
                        showToast(`¡Archivo ${file.name} subido con éxito!`, "success");
                        showView(secType, secType === 'subject' ? getSubjectIdByFolder(folder) : folder);
                    }
                };

                reader.onerror = function() {
                    showToast("Error al leer el archivo local.", "error");
                    btn.disabled = false;
                    btn.innerHTML = `<i class="fa-solid fa-cloud-arrow-up"></i> Publicar en GitHub`;
                };

                reader.readAsDataURL(file);
            }
        }

        function getSubjectIdByFolder(folder) {
            const found = appConfig.subjects.find(s => s.folder === folder);
            return found ? found.id : folder;
        }

        /* -------------------------------------------------------------------------- */
        /*   VISTA 5: AJUSTES Y CONFIGURACIÓN                                        */
        /* -------------------------------------------------------------------------- */
        function renderSettingsHTML() {
            return `
                <div class="space-y-6 animate-fade-in max-w-4xl">
                    <div class="bg-white dark:bg-darkcard border border-slate-200 dark:border-darkborder rounded-2xl p-6 space-y-2">
                        <span class="px-2.5 py-1 bg-purple-500/10 text-purple-500 text-xs font-mono font-bold rounded-lg border border-purple-500/20">
                            Ajustes Visuales & Módulos
                        </span>
                        <h1 class="text-2xl font-extrabold text-slate-900 dark:text-white">Gestión de Asignaturas</h1>
                        <p class="text-xs text-slate-500 dark:text-slate-400">Reordena o añade nuevas asignaturas de tu ciclo.</p>
                    </div>

                    <div class="bg-white dark:bg-darkcard border border-slate-200 dark:border-darkborder rounded-2xl p-6 space-y-4">
                        <div class="flex items-center justify-between">
                            <h3 class="text-sm font-bold text-slate-900 dark:text-white">Módulos Configurados (${appConfig.subjects.length})</h3>
                            <button onclick="addNewSubjectPrompt()" class="px-3 py-1.5 bg-brand-600 text-white text-xs font-semibold rounded-lg hover:bg-brand-500 transition flex items-center gap-1">
                                <i class="fa-plus"></i> Añadir Asignatura
                            </button>
                        </div>

                        <div class="space-y-2">
                            ${appConfig.subjects.map((s, idx) => `
                                <div class="flex flex-wrap items-center justify-between p-3 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl gap-2 text-xs">
                                    <div class="flex items-center gap-3">
                                        <span class="font-mono font-bold text-brand-500 w-12">${s.codigo}</span>
                                        <span class="font-semibold text-slate-800 dark:text-slate-200">${s.nombre}</span>
                                        <span class="font-mono text-slate-400 text-[10px]">(${s.folder})</span>
                                    </div>
                                    <div class="flex items-center gap-1">
                                        <button onclick="moveSubject(${idx}, -1)" class="p-1 hover:text-brand-400"><i class="fa-solid fa-arrow-up"></i></button>
                                        <button onclick="moveSubject(${idx}, 1)" class="p-1 hover:text-brand-400"><i class="fa-solid fa-arrow-down"></i></button>
                                        <button onclick="deleteSubject(${idx})" class="p-1 hover:text-rose-400"><i class="fa-solid fa-trash"></i></button>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        function addNewSubjectPrompt() {
            const code = prompt("Código del módulo (ej: ISO):");
            if (!code) return;
            const name = prompt("Nombre completo:");
            const folder = prompt("Nombre de carpeta en GitHub (ej: iso):");

            appConfig.subjects.push({
                id: folder.toLowerCase().replace(/\s+/g, '-'),
                codigo: code.toUpperCase(),
                nombre: name || code,
                folder: folder.toLowerCase(),
                icon: "fa-folder",
                color: "brand",
                desc: "Módulo añadido manualmente."
            });

            saveAppConfig(appConfig);
            renderView('settings');
            showToast("Asignatura añadida a la vista local.", "success");
        }

        function deleteSubject(idx) {
            customConfirm("Eliminar asignatura", "¿Seguro que deseas eliminar esta asignatura de la vista?", () => {
                appConfig.subjects.splice(idx, 1);
                saveAppConfig(appConfig);
                renderView('settings');
                showToast("Asignatura eliminada de la vista.", "info");
            });
        }

        function moveSubject(idx, dir) {
            const newIdx = idx + dir;
            if (newIdx < 0 || newIdx >= appConfig.subjects.length) return;
            const temp = appConfig.subjects[idx];
            appConfig.subjects[idx] = appConfig.subjects[newIdx];
            appConfig.subjects[newIdx] = temp;
            saveAppConfig(appConfig);
            renderView('settings');
        }

        /* -------------------------------------------------------------------------- */
        /*   COMPONENTES AUXILIARES                                                   */
        /* -------------------------------------------------------------------------- */
        function renderFilesGridHTML(data) {
            return `
                <div class="bg-white dark:bg-darkcard border border-slate-200 dark:border-darkborder rounded-2xl p-6 space-y-4">
                    <h3 class="text-sm font-bold text-slate-900 dark:text-white flex items-center gap-2">
                        <i class="fa-solid fa-file-code text-brand-500"></i>
                        Archivos en GitHub (${data.length})
                    </h3>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                        ${data.map(file => {
                            const isDir = file.type === 'dir';
                            return `
                                <div class="flex items-center justify-between p-3 bg-slate-50 dark:bg-slate-900/60 border border-slate-200 dark:border-slate-800 rounded-xl hover:border-brand-500/40 transition">
                                    <div class="flex items-center gap-3 truncate">
                                        <i class="${getFileIcon(file.name)} text-base w-5 text-center"></i>
                                        <div class="truncate">
                                            <div class="text-xs font-bold text-slate-800 dark:text-slate-200 font-mono truncate">${file.name}</div>
                                            <div class="text-[10px] text-slate-400 font-mono">${isDir ? 'Subcarpeta' : formatBytes(file.size)}</div>
                                        </div>
                                    </div>

                                    <div class="flex items-center gap-1.5 shrink-0">
                                        ${!isDir && file.download_url ? `
                                            <button onclick="openFilePreview('${file.name}', '${file.download_url}')" class="px-2 py-1 bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 rounded text-[11px] font-semibold transition">
                                                <i class="fa-regular fa-eye"></i>
                                            </button>
                                            <a href="${file.download_url}" target="_blank" download class="px-2 py-1 bg-brand-600 hover:bg-brand-500 text-white rounded text-[11px] font-semibold transition">
                                                <i class="fa-solid fa-download"></i>
                                            </a>
                                        ` : ''}
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `;
        }

        function renderGitHubErrorHTML(path) {
            return `
                <div class="bg-amber-500/10 border border-amber-500/30 rounded-2xl p-6 text-slate-300 space-y-3">
                    <div class="flex items-center gap-3 text-amber-500 font-bold text-sm">
                        <i class="fa-solid fa-triangle-exclamation text-lg"></i>
                        <span>Carpeta no encontrada en GitHub (./${path}/)</span>
                    </div>
                    <p class="text-xs text-slate-400 leading-relaxed">
                        Aún no se han publicado entregas en <strong><code>${path}</code></strong>. Puedes usar el botón superior <strong>"Publicar en esta asignatura"</strong> para subir la primera práctica.
                    </p>
                </div>
            `;
        }

        function renderEmptyFolderHTML(path) {
            return `
                <div class="bg-white dark:bg-darkcard border border-dashed border-slate-300 dark:border-slate-700 rounded-2xl p-8 text-center space-y-2">
                    <i class="fa-regular fa-folder-open text-3xl text-slate-400"></i>
                    <p class="text-xs text-slate-400">La carpeta <code>${path}</code> está vacía en GitHub.</p>
                </div>
            `;
        }

        async function openFilePreview(fileName, downloadUrl) {
            const modal = document.getElementById('file-modal');
            const titleEl = document.getElementById('modal-file-title');
            const bodyEl = document.getElementById('modal-file-body');
            const iconEl = document.getElementById('modal-file-icon');
            const downloadBtn = document.getElementById('modal-file-download');

            titleEl.innerText = fileName;
            downloadBtn.href = downloadUrl;
            iconEl.className = getFileIcon(fileName) + " text-xl text-brand-500";
            bodyEl.innerHTML = `<div class="text-center p-8"><i class="fa-solid fa-spinner fa-spin text-xl text-brand-500"></i><p class="mt-2">Cargando...</p></div>`;

            modal.classList.remove('hidden');

            const content = await fetchRawFileContent(downloadUrl);
            bodyEl.innerHTML = `<pre class="overflow-x-auto text-emerald-400"><code>${escapeHtml(content)}</code></pre>`;
        }

        function closeFileModal() {
            document.getElementById('file-modal').classList.add('hidden');
        }

        function getFileIcon(filename) {
            const ext = filename.split('.').pop().toLowerCase();
            if (ext === 'pdf') return 'fa-solid fa-file-pdf text-rose-500';
            if (['sh', 'bash', 'zsh'].includes(ext)) return 'fa-solid fa-terminal text-emerald-400';
            if (['ps1', 'bat'].includes(ext)) return 'fa-solid fa-terminal text-blue-400';
            if (['py', 'js', 'html', 'css', 'json', 'yml', 'yaml'].includes(ext)) return 'fa-solid fa-code text-cyan-400';
            if (['pkt', 'pka'].includes(ext)) return 'fa-solid fa-network-wired text-amber-400';
            if (['doc', 'docx'].includes(ext)) return 'fa-solid fa-file-word text-blue-500';
            if (['md', 'txt'].includes(ext)) return 'fa-solid fa-file-lines text-slate-400';
            if (['png', 'jpg', 'jpeg', 'svg', 'webp'].includes(ext)) return 'fa-solid fa-file-image text-purple-400';
            return 'fa-solid fa-file text-slate-400';
        }

        function formatBytes(bytes, decimals = 2) {
            if (!+bytes) return '0 Bytes';
            const k = 1024;
            const dm = decimals < 0 ? 0 : decimals;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return `${parseFloat((bytes / Math.pow(k, i)).toFixed(dm))} ${sizes[i]}`;
        }

        function setupSearch() {
            const input = document.getElementById('global-search');
            input.addEventListener('input', (e) => {
                const query = e.target.value.toLowerCase().trim();
                if (!query) {
                    renderView(currentView, currentParam);
                    return;
                }
                const filtered = appConfig.subjects.filter(s => s.nombre.toLowerCase().includes(query) || s.codigo.toLowerCase().includes(query));
                const container = document.getElementById('app-content');
                container.innerHTML = `
                    <div class="space-y-4">
                        <h2 class="text-lg font-bold">Resultados para "${query}" (${filtered.length})</h2>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                            ${filtered.map(s => `
                                <div onclick="showView('subject', '${s.id}')" class="bg-white dark:bg-darkcard border border-slate-200 dark:border-darkborder rounded-xl p-4 cursor-pointer hover:border-brand-500">
                                    <div class="font-bold text-sm text-brand-500">${s.codigo} - ${s.nombre}</div>
                                    <div class="text-xs text-slate-400 mt-1">${s.desc}</div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            });
        }

        function setupCodeCopyButtons() {
            document.querySelectorAll('.markdown-body pre').forEach(pre => {
                if (pre.querySelector('.copy-btn')) return;
                const btn = document.createElement('button');
                btn.className = 'copy-btn absolute top-2 right-2 px-2 py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 text-[10px] font-mono rounded border border-slate-700 transition';
                btn.innerHTML = '<i class="fa-regular fa-copy"></i> Copiar';
                pre.style.position = 'relative';
                pre.appendChild(btn);

                btn.onclick = () => {
                    const code = pre.querySelector('code')?.innerText || pre.innerText;
                    copyToClipboardSafe(code, btn);
                };
            });
        }

        function copyToClipboardSafe(text, btnElement) {
            const tempArea = document.createElement('textarea');
            tempArea.value = text;
            tempArea.style.position = 'fixed';
            tempArea.style.opacity = '0';
            document.body.appendChild(tempArea);
            tempArea.select();
            try {
                document.execCommand('copy');
                if (btnElement) {
                    const orig = btnElement.innerHTML;
                    btnElement.innerHTML = `<i class="fa-solid fa-check text-emerald-400"></i> Copiado`;
                    setTimeout(() => btnElement.innerHTML = orig, 2000);
                }
                showToast("Copiado al portapapeles", "success");
            } catch (err) {
                showToast("Error al copiar text", "error");
            } finally {
                document.body.removeChild(tempArea);
            }
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        function escapeJsString(str) {
            if (!str) return '';
            return str.replace(/\\/g, '\\\\').replace(/`/g, '\\`').replace(/\$/g, '\\$');
        }
    </script>
</body>
